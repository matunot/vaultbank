name: Auto Deploy VaultBank

"on":
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  # ─── Backend: Verify + Deploy to Render ──────────────────────────────
  backend:
    name: Backend - Verify & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all backend files
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking syntax..."
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -name "*.js" -not -path "./node_modules/*" -print0)
          echo "✅ Backend syntax OK"

      - name: Run backend tests
        run: npm test -- --runInBand

      # Render has autoDeploy=yes on main. Always run a blocking public verification;
      # don't silently skip the check just because an optional deploy-hook secret is absent.
      - name: Verify Render deployment (health + PostgreSQL readiness + SPA + fail-closed rails)
        if: success()
        timeout-minutes: 7
        shell: bash
        env:
          RENDER_BASE_URL: https://vaultbank-md20.onrender.com
        run: |
          set -euo pipefail
          echo "Allowing the Render auto-deploy to start..."
          sleep 60
          for attempt in $(seq 1 30); do
            echo "Render readiness check $attempt/30"
            status=$(curl -sS -o /tmp/render-health.json -w "%{http_code}" --max-time 10 "$RENDER_BASE_URL/health" || true)
            if [ "$status" = "200" ]; then
              if node scripts/verify-deploy.js "$RENDER_BASE_URL"; then
                echo "✅ Render health, PostgreSQL readiness, SPA shell, and fail-closed rail checks passed."
                exit 0
              fi
              echo "Health responded 200 but full deployment verification is not ready yet."
            else
              echo "Render /health returned HTTP ${status:-no-response}"
            fi
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done
          echo "::error::Render deployment did not pass health + SPA + webhook verification."
          exit 1

  # ─── Frontend: Verify Build (Vercel auto-deploys from GitHub) ───────
  frontend:
    name: Frontend - Verify Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify built file
        run: |
          if [ -f dist/index.html ]; then
            echo "✅ Frontend build successful!"
            SIZE=$(ls -lh dist/index.html | awk '{print $5}')
            echo "📦 Bundle size: $SIZE"
          else
            echo "❌ Build output not found!"
            exit 1
          fi