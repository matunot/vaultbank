name: Deploy to Vercel
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          echo "Checking required secrets..."
          MISSING=""

          # Auth & Database secrets
          [ -z "${{ secrets.JWT_SECRET }}" ] && MISSING="$MISSING JWT_SECRET"
          [ -z "${{ secrets.DATABASE_URL }}" ] && MISSING="$MISSING DATABASE_URL"

          # SMTP secrets
          [ -z "${{ secrets.SMTP_HOST }}" ] && MISSING="$MISSING SMTP_HOST"
          [ -z "${{ secrets.SMTP_PORT }}" ] && MISSING="$MISSING SMTP_PORT"
          [ -z "${{ secrets.SMTP_USER }}" ] && MISSING="$MISSING SMTP_USER"
          [ -z "${{ secrets.SMTP_PASS }}" ] && MISSING="$MISSING SMTP_PASS"
          [ -z "${{ secrets.SMTP_FROM }}" ] && MISSING="$MISSING SMTP_FROM"

          # Payment provider secrets
          [ -z "${{ secrets.PAYMENT_PROVIDER_STRIPE_KEY }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_STRIPE_KEY"
          [ -z "${{ secrets.PAYMENT_PROVIDER_STRIPE_SECRET }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_STRIPE_SECRET"
          [ -z "${{ secrets.PAYMENT_PROVIDER_RAZORPAY_KEY }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_RAZORPAY_KEY"
          [ -z "${{ secrets.PAYMENT_PROVIDER_RAZORPAY_SECRET }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_RAZORPAY_SECRET"
          [ -z "${{ secrets.PAYMENT_PROVIDER_PAYPAL_CLIENT_ID }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_PAYPAL_CLIENT_ID"
          [ -z "${{ secrets.PAYMENT_PROVIDER_PAYPAL_SECRET }}" ] && MISSING="$MISSING PAYMENT_PROVIDER_PAYPAL_SECRET"

          # Vercel token
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && MISSING="$MISSING VERCEL_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::warning::Missing secrets:$MISSING"
            echo "Some secrets are not configured. Deployment will continue but functionality may be limited."
            echo "Please add these secrets in GitHub Settings > Secrets and variables > Actions"
          else
            echo "✅ All required secrets are configured"
          fi
          # Always succeed - missing secrets are warnings only
          exit 0

  deploy:
    runs-on: ubuntu-latest
    needs: validate-secrets
    env:
      CI: "true"
      DISABLE_ESLINT_PLUGIN: "true"
      ESLINT_NO_DEV_ERRORS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd client
          npm install --no-audit --no-fund
          # Fix: lightningcss optional native binary for Linux CI runners
          # The lockfile may have been generated on Windows/macOS and missing Linux binaries
          npm install --no-save lightningcss-linux-x64-gnu --no-audit --no-fund 2>/dev/null || true
          # Copy the native binary to where lightningcss expects it
          if [ -f node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node ]; then
            cp node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node node_modules/lightningcss/
          fi

      - name: Verify node-deps patches were applied
        run: |
          cd client
          test -f node_modules/ajv-keywords/dist/keywords/index.js && \
            grep -q formatMinimum node_modules/ajv-keywords/dist/keywords/index.js || \
            (echo "ajv-keywords patch missing"; node scripts/patch-node-deps.js)
          test -f node_modules/react-refresh/cjs/react-refresh-babel.production.min.js && \
            grep -q "if(false)" node_modules/react-refresh/cjs/react-refresh-babel.production.min.js || \
            (echo "react-refresh patch missing"; node scripts/patch-node-deps.js)

      - name: Build client
        run: |
          cd client && npm run build --if-present

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
