name: Keep Render Backend Alive + Health Bot

"on":
  schedule:
    # Run every 10 minutes to keep Render free tier awake (spins down after 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  issues: write
  contents: read

jobs:
  ping-backend:
    name: Ping VaultBank Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        id: health
        run: |
          echo "Pinging https://vaultbank-md20.onrender.com/health"
          RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}|%{time_total}" --max-time 60 \
            https://vaultbank-md20.onrender.com/health)
          STATUS=$(echo "$RESPONSE" | cut -d'|' -f1)
          TIME=$(echo "$RESPONSE" | cut -d'|' -f2)
          echo "HTTP Status: $STATUS | Response Time: ${TIME}s"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

          # If response time is > 30s, it likely cold-started (was asleep)
          COLD_START=$(awk "BEGIN { print ($TIME > 30) ? 1 : 0 }")
          if [ "$COLD_START" = "1" ]; then
            echo "::warning::Backend was cold-starting (asleep). Response took ${TIME}s."
            echo "cold_start=true" >> "$GITHUB_OUTPUT"
          else
            echo "Backend is warm and responsive (${TIME}s)."
            echo "cold_start=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test real login endpoint
        id: login_test
        run: |
          echo "Testing real login (POST /login)"
          LOGIN_RESPONSE=$(curl -sS -o /tmp/login.json -w "%{http_code}" --max-time 60 \
            -X POST https://vaultbank-md20.onrender.com/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@vaultbank.com","password":"password"}')
          echo "Login HTTP Status: $LOGIN_RESPONSE"
          echo "status=$LOGIN_RESPONSE" >> "$GITHUB_OUTPUT"

          if [ "$LOGIN_RESPONSE" = "200" ]; then
            echo "✅ Login test PASSED — API is functional"
          else
            echo "❌ Login test FAILED — API is broken or returning errors"
            cat /tmp/login.json 2>/dev/null || true
          fi

      - name: Ping root endpoint
        run: |
          echo "Pinging https://vaultbank-md20.onrender.com/"
          curl -sS -o /dev/null -w "HTTP Status: %{http_code} | Response Time: %{time_total}s\n" \
            --max-time 60 \
            https://vaultbank-md20.onrender.com/

      - name: Open GitHub Issue if backend is down
        if: steps.health.outputs.status != '200' || steps.login_test.outputs.status != '200'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEALTH_STATUS="${{ steps.health.outputs.status }}"
          LOGIN_STATUS="${{ steps.login_test.outputs.status }}"

          # Check if an outage issue is already open
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --label "🚨 outage" --json title 2>/dev/null || echo "[]")
          ALREADY_OPEN=$(echo "$EXISTING" | grep -c "VaultBank Backend Outage" || true)

          if [ "$ALREADY_OPEN" -gt 0 ]; then
            echo "⚠️ Outage issue already open — skipping duplicate."
          else
            BODY="## 🚨 VaultBank Backend Outage Detected

            The health-bot detected that the backend is DOWN or misbehaving.

            | Check | Status |
            |-------|--------|
            | Health Check | \`${HEALTH_STATUS:-N/A}\` |
            | Login Test | \`${LOGIN_STATUS:-N/A}\` |

            **Possible causes:**
            - Render free tier might have exceeded its monthly hours
            - Backend deployment failed or is crashing
            - Database (Neon) connection issue
            - Rate limiting (too many requests)

            **Next steps:**
            1. Check Render dashboard: https://dashboard.render.com
            2. View backend logs for errors
            3. Check Neon database status: https://console.neon.tech

            This issue was auto-created by the keep-alive health bot 🤖"

            gh issue create --repo "${{ github.repository }}" \
              --title "🚨 VaultBank Backend Outage Detected" \
              --body "$BODY" \
              --label "🚨 outage"
            echo "✅ Outage issue created."
          fi

      - name: Close outage issue when backend recovers
        if: steps.health.outputs.status == '200' && steps.login_test.outputs.status == '200'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find any open outage issues
          ISSUES=$(gh issue list --repo "${{ github.repository }}" --state open --label "🚨 outage" --json number,title 2>/dev/null || echo "[]")

          if [ -n "$ISSUES" ] && [ "$ISSUES" != "[]" ]; then
            echo "$ISSUES" | gh run --help > /dev/null 2>&1 || true
            # Extract and close issues matching outage title
            echo "$ISSUES" | python3 -c "
            import json, sys
            try:
              issues = json.load(sys.stdin)
            except:
              issues = []
            for issue in issues:
              if 'VaultBank Backend Outage' in issue.get('title', ''):
                print(issue['number'])
            " | while read num; do
              if [ -n "$num" ]; then
                gh issue close --repo "${{ github.repository }}" "$num" --comment "✅ Health-bot: Backend is healthy again. Closing this outage issue."
                echo "✅ Closed outage issue #$num"
              fi
            done
          else
            echo "No open outage issues to close."
          fi