name: Integration Tests (PostgreSQL)

"on":
  workflow_dispatch: # Allow manual triggering
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'server/routes/accounts.js'
      - 'server/routes/external-payouts.js'
      - 'server/routes/direct-upi.js'
      - 'server/routes/direct-bank-payouts.js'
      - 'server/routes/bank-deposits.js'
      - 'server/__tests__/directUpi.test.js'
      - 'server/__tests__/directBankPayouts.test.js'
      - 'server/__tests__/bankDeposits.test.js'
      - 'client/src/components/DirectUpiDepositModal.tsx'
      - 'client/src/components/DirectUpiAdminReview.tsx'
      - 'client/src/components/DirectBankPayoutModal.tsx'
      - 'client/src/components/DirectBankPayoutAdminReview.tsx'
      - 'client/src/components/PaymentsSection.tsx'
      - 'client/src/api.ts'
      - 'server/routes/collections.js'
      - 'server/collections/**'
      - 'server/payouts/**'
      - 'server/services/**'
      - 'server/vbr/**'
      - 'server/config/**'
      - 'server/__tests__/databaseProductionSafety.test.js'
      - 'server/migrations/**'
      - 'server/utils/schemaReadiness.js'
      - 'server/scripts/check-inr-schema.js'
      - 'server/__tests__/pgIntegration.test.js'
      - 'server/__tests__/pgHttpIntegration.test.js'
      - 'server/__tests__/vbrHttpIntegration.test.js'
      - 'server/__tests__/inrPgIntegration.test.js'
      - 'server/__tests__/vbr.test.js'
      - 'server/__tests__/inrRails.test.js'
      - 'server/__tests__/cashfreeAdapters.test.js'
      - 'server/__tests__/inrSchemaFailClosed.test.js'
      - 'server/__tests__/helpers/pgTestSetup.js'
      - 'server/scripts/run-migrations.js'
      - '.github/workflows/integration-tests.yml'

jobs:

  frontend-verify:
    name: Frontend - TypeScript and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultbank
          POSTGRES_PASSWORD: vaultbank_test_pw
          POSTGRES_DB: vaultbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run production database safety tests
        run: npx --yes jest@30.5.2 __tests__/databaseProductionSafety.test.js --runInBand --testPathIgnorePatterns /node_modules/

      - name: Run direct UPI safety tests
        run: |
          npx --yes jest@30.5.2 __tests__/directUpi.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --runInBand --testTimeout=60000 --verbose --forceExit

      - name: Run manual bank payout safety tests
        run: |
          npx --yes jest@30.5.2 __tests__/directBankPayouts.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --runInBand --testTimeout=60000 --verbose --forceExit

      - name: Run native bank deposit safety tests
        run: |
          npx --yes jest@30.5.2 __tests__/bankDeposits.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --runInBand --testTimeout=60000 --verbose --forceExit


      - name: Create test database
        run: |
          PGPASSWORD=vaultbank_test_pw psql -h localhost -U vaultbank -d vaultbank -c "CREATE DATABASE vaultbank_test"

      - name: Run SQL-direct integration tests (real PostgreSQL concurrency)
        run: |
          npx --yes jest@30.5.2 __tests__/pgIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=60000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test

      - name: Run HTTP handler integration tests (real route + real middleware + real PostgreSQL)
        run: |
          npx --yes jest@30.5.2 __tests__/pgHttpIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=120000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test

      - name: Run VBR intent execution integration tests (real VBR route + real PostgreSQL)
        run: |
          npx --yes jest@30.5.2 __tests__/vbrHttpIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=120000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test

      - name: Run INR collections/payouts integration tests (real routes + real PostgreSQL)
        run: |
          npx --yes jest@30.5.2 __tests__/inrPgIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=180000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test
