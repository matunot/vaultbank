name: Integration Tests (PostgreSQL)

"on":
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths:
      - 'server/routes/accounts.js'
      - 'server/migrations/**'
      - 'server/__tests__/pgIntegration.test.js'
      - 'server/__tests__/pgHttpIntegration.test.js'
      - 'server/__tests__/helpers/pgTestSetup.js'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultbank
          POSTGRES_PASSWORD: vaultbank_test_pw
          POSTGRES_DB: vaultbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: |
          PGPASSWORD=vaultbank_test_pw psql -h localhost -U vaultbank -d vaultbank -c "CREATE DATABASE vaultbank_test"

      - name: Run mock-level unit tests (regression check)
        run: npm test -- --forceExit

      - name: Run SQL-direct integration tests (real PostgreSQL concurrency)
        run: |
          npx jest __tests__/pgIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=60000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test

      - name: Run HTTP handler integration tests (real route + real middleware + real PostgreSQL)
        run: |
          npx jest __tests__/pgHttpIntegration.test.js \
            --testPathIgnorePatterns /node_modules/ \
            --testTimeout=120000 \
            --verbose --forceExit
        env:
          TEST_DATABASE_URL: postgres://vaultbank:vaultbank_test_pw@localhost:5432/vaultbank_test
