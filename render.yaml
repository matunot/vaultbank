services:
  - type: web
    name: vaultbank-backend
    env: node
    # ⚠️ IMPORTANT: The free tier automatically spins down after 15 minutes of inactivity.
    # This causes cold-starts (30-60s delay) for users. To prevent this:
    #   1. Keep plan: free and rely on the GitHub Actions keep-alive workflow
    #      (.github/workflows/keep-alive.yml) which pings the server every 10 minutes.
    #   2. OR upgrade to a paid plan (Starter $7/mo) which never spins down.
    # The keep-alive MUST come from an external source (GitHub Actions, UptimeRobot,
    # or the scripts/keep-alive.js script) - a self-ping on Render won't work because
    # a spun-down server can't ping itself.
    plan: free
    runtime: nodejs24
    # Build installs server deps, then builds the React app into client/dist so the
    # backend can serve the whole app on a single origin (frontend + API).
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: node index.js
    workingDirectory: server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@vaultbank.com
      # ADMIN_PASSWORD must be supplied in the Render dashboard (never a
      # committed default; the server refuses well-known/default role
      # passwords at boot).
      - key: ADMIN_PASSWORD
        sync: false
      # ── INR rails: Cashfree Auto Collect (inbound) + Payouts (outbound) ──
      # Fail-closed: with no client credentials the routes answer 503.
      # CASHFREE_ENV is intentionally sync:false so a Blueprint sync cannot
      # flip a live service back to sandbox. Set it to `sandbox` on a staging
      # service and `live` on production; an unset value defaults to sandbox,
      # which a NODE_ENV=production service refuses.
      - key: VB_COLLECTIONS_PROVIDER
        value: cashfree
      - key: VB_PAYOUT_PROVIDER
        value: cashfree
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_PAYOUTS_CLIENT_ID
        sync: false
      - key: CASHFREE_PAYOUTS_CLIENT_SECRET
        sync: false
      # ── Real Money Providers (set these in Render dashboard when you have keys) ──
      - key: PAYMENT_PROVIDER_STRIPE_KEY
        sync: false
      - key: PAYMENT_PROVIDER_STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYMENT_PROVIDER_PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      # ── USDC deposits: account-level XPUB (public only — generates
      # addresses, can never spend). Sweeping needs the offline xpriv.
      - key: USDC_XPUB
        sync: false
      # ── USDC hot wallet: 0x + 64 hex key material of the HOT wallet (NOT the
      # deposit xpub). One var enables crypto deposits AND chain withdrawals.
      - key: USDC_HOT_WALLET_KEY
        sync: false
      # Base Sepolia TEST MODE — leave unset in production. Setting
      # USDC_TESTNET_MODE to exactly 'base-sepolia' switches the USDC rail to
      # Base Sepolia (84532, Circle test USDC) with a SANDBOX ledger
      # (sandbox_* / usdc_test_* tables); production tables and the
      # production hot-wallet key are never loaded in test mode.
      - key: USDC_TESTNET_MODE
        sync: false
      - key: USDC_BASE_SEPOLIA_HOT_WALLET_KEY
        sync: false
      - key: USDC_BASE_SEPOLIA_RPC_URL
        sync: false
